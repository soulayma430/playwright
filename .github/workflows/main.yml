#l'utilité de faire l'exécution des tests sur une appareil ubuntu dans le cloud 
name: Playwright Tests
on:
  push:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest 
    steps:
    - uses: actions/checkout@v5 #copy code in the ubuntu-latest
    - uses: actions/setup-node@v5 #install node on the the ubuntu-latest
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci # install dependencies
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps #Install browsers
    - name: Run Playwright tests
      run: npx playwright test --trace on
    - uses: actions/upload-artifact@v4 #save the reports of the test on artifacts in the github
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30